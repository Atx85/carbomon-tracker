name: Android build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        # GitHub's Ubuntu runner installs sdkmanager outside PATH.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - name: Run unit tests and build release APK
        # APK contents are public, so never embed repository API credentials.
        run: |
          bash ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PUSDA_API_KEY= -PFATSECRET_CLIENT_ID= -PFATSECRET_CLIENT_SECRET=

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v7
        with:
          name: carbomon-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add build artifact link to summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### CarboMon Android build\n\n[Unsigned build artifact (not installable)](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish latest public APK
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v8
        with:
          name: carbomon-unsigned-release-apk
          path: release

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APK signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"

      - name: Sign and verify release APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing release signing secret: $variable. Configure the existing release keystore using scripts/configure-release-signing.py."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/carbomon-release.keystore"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p 4 release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/carbomon-release.keystore" \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass env:ANDROID_RELEASE_STORE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            --out release/carbomon-latest.apk release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose release/carbomon-latest.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          printf 'Signed Android release from commit `%s`.\n\nDownload `carbomon-latest.apk` below and install it on Android 10 or newer.\n\nAPI credentials are omitted from public builds. Saved foods, generic staples and Open Food Facts barcode lookup are available.\n' "$GITHUB_SHA" > release/notes.md
          gh release create "$RELEASE_TAG" release/carbomon-latest.apk \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "CarboMon build $GITHUB_RUN_NUMBER" \
            --notes-file release/notes.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
          printf '### Public Android download\n\n[Download latest APK](%s/%s/releases/latest/download/carbomon-latest.apk)\n' "$GITHUB_SERVER_URL" "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/carbomon-release.keystore"
