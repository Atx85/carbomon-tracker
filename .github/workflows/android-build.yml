name: Android build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        # GitHub's Ubuntu runner installs sdkmanager outside PATH.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - name: Restore persistent APK signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
              echo '::error::Set ANDROID_DEBUG_KEYSTORE_BASE64 to the original debug keystore before publishing. A new signing key would prevent existing installations from updating.'
              exit 1
            fi
            echo '::warning::No persistent signing key configured. This branch APK cannot be relied on to update an existing installation.'
            exit 0
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null

      - name: Run unit tests and build debug APK
        # APK contents are public, so never embed repository API credentials.
        run: |
          bash ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -PUSDA_API_KEY= -PFATSECRET_CLIENT_ID= -PFATSECRET_CLIENT_SECRET=

      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@v7
        with:
          name: carbomon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add build artifact link to summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### CarboMon Android build\n\n[Build artifact (GitHub login required)](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove runner signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"

  publish:
    name: Publish latest public APK
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v8
        with:
          name: carbomon-debug-apk
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cp release/app-debug.apk release/carbomon-latest.apk
          printf 'Android test build from commit `%s`.\n\nDownload `carbomon-latest.apk` below and install it on Android 10 or newer.\n\nAPI credentials are omitted from public builds. Saved foods, generic staples and Open Food Facts barcode lookup are available.\n' "$GITHUB_SHA" > release/notes.md
          gh release create "$RELEASE_TAG" release/carbomon-latest.apk \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "CarboMon build $GITHUB_RUN_NUMBER" \
            --notes-file release/notes.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
          printf '### Public Android download\n\n[Download latest APK](%s/%s/releases/latest/download/carbomon-latest.apk)\n' "$GITHUB_SERVER_URL" "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"
